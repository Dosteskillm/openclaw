name: Build Custom OpenClaw Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag suffix (e.g. 2026.4.23)'
        required: true
        default: '2026.4.23'
      push:
        description: 'Push to registry'
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dosteskillm/openclaw
  # GitHub-hosted runners have direct internet access; no proxy needed.
  # If using a self-hosted runner with a proxy, uncomment below:
  # HTTP_PROXY: http://your-proxy-ip:port
  # HTTPS_PROXY: http://your-proxy-ip:port

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}-amd64
          build-args: |
            OPENCLAW_INSTALL_BROWSER=1
          cache-from: type=gha,scope=openclaw-custom-amd64
          cache-to: type=gha,mode=max,scope=openclaw-custom-amd64
          provenance: false

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}-arm64
          build-args: |
            OPENCLAW_INSTALL_BROWSER=1
          cache-from: type=gha,scope=openclaw-custom-arm64
          cache-to: type=gha,mode=max,scope=openclaw-custom-arm64
          provenance: false

  create-manifest:
    needs: [build-amd64, build-arm64]
    if: always() && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
